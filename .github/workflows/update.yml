name: Kindle Panel Guncelleme

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Depoyu Kopyala
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Fontlari ve Resim Kutuphanesini Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
          pip install pillow

      - name: Python Betigini Calistir
        run: |
          python main.py

      - name: Degisiklikleri Zorla Kaydet ve Gonder
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add screen.png panel.html
          git commit -m "Otomatik panel guncellemesi" || true
          git push --force origin HEAD:main
