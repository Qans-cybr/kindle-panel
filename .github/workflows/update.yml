name: Kindle Panel Guncelleme

on:
  schedule:
    - cron: '0 6 * * *'  # Her sabah saat 06:00'da otomatik çalışır
  workflow_dispatch:      # İstediğin zaman elle de çalıştırabilirsin

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Depoyu Kopyala
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Python Betigini Calistir
        run: |
          python main.py

      - name: Degisiklikleri Kaydet ve Gonder
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add panel.html
          git diff --staged --quiet || git commit -m "Otomatik panel guncellemesi (Gunluk)"
          git push
